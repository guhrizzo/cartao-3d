<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartão 3D • Site que chama atenção</title>
  <meta name="description" content="Cartão 3D interativo que troca de cor. Sites que chamam atenção para o seu negócio.">
  <meta name="theme-color" content="#0B0B0F">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body data-theme="black">
  <div class="glow" aria-hidden="true"></div>

  <header class="topo">
    <a class="marca" href="#" id="marca">SeuNome</a>
    <a class="btn btn-sm" id="cta-topo" href="#contato">Quero o meu</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-texto">
        <p class="selo">Site 3D interativo</p>
        <h1 id="titulo"></h1>
        <p class="sub" id="subtitulo"></p>
        <div class="acoes">
          <a class="btn" id="cta-principal" href="#contato">Chamar no WhatsApp</a>
          <a class="btn btn-ghost" href="#beneficios">Ver detalhes</a>
        </div>
      </div>

      <div class="hero-card">
        <div id="stage" class="stage" aria-label="Cartão 3D. Arraste para girar."></div>
        <p class="dica">Arraste para girar</p>

        <div class="cores" id="cores" role="group" aria-label="Cor do cartão"></div>
        <div class="controles">
          <button class="mini" id="btn-auto" type="button" aria-pressed="true">Troca automática: ligada</button>
          <button class="mini" id="btn-virar" type="button">Ver verso</button>
        </div>
      </div>
    </section>

    <section class="beneficios" id="beneficios">
      <div class="grade" id="grade"></div>
    </section>

    <section class="contato" id="contato">
      <h2>Vamos tirar o seu site do papel?</h2>
      <p>Me chame e eu te mostro como ficaria o seu negócio.</p>
      <div class="acoes centro">
        <a class="btn" id="cta-whats" target="_blank" rel="noopener" href="#">WhatsApp</a>
        <a class="btn btn-ghost" id="cta-insta" target="_blank" rel="noopener" href="#">Instagram</a>
      </div>
    </section>
  </main>

  <footer class="rodape"><span id="rodape"></span></footer>

  <script type="module" src="main.js"></script>
</body>
</html>
